name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m

          script: |
            set -e

            echo "=============================="
            echo "🚀 START DEPLOYMENT SCRIPT"
            echo "=============================="

            echo "📌 STEP 1: Who am I?"
            whoami
            uname -a
            pwd

            echo "=============================="
            echo "📌 STEP 2: Checking Docker"
            docker --version || echo "❌ Docker not found"

            echo "📌 STEP 3: Checking Docker Compose"
            docker compose version || echo "❌ Docker compose not found"

            echo "=============================="
            echo "📌 STEP 4: Moving to project directory"

            cd ~/authentication_be || {
              echo "❌ Directory not found: ~/authentication_be"
              ls -la ~
              exit 1
            }

            echo "📂 Current directory:"
            pwd
            ls -la

            echo "=============================="
            echo "📌 STEP 5: Checking Git repo"

            git status || echo "❌ Not a git repo"
            git remote -v || echo "❌ No remote configured"

            echo "⬇️ Pulling latest code"
            git pull origin main || {
              echo "❌ Git pull failed"
              exit 1
            }

            echo "=============================="
            echo "📌 STEP 6: Stopping containers"

            docker compose down || {
              echo "⚠️ No containers running or compose failed"
            }

            echo "=============================="
            echo "📌 STEP 7: Building containers"

            docker compose up --build -d || {
              echo "❌ Docker compose build failed"
              docker compose logs
              exit 1
            }

            echo "=============================="
            echo "📌 STEP 8: Running containers"

            docker ps -a

            echo "=============================="
            echo "📌 STEP 9: Container logs (last 50 lines)"

            docker logs auth-backend --tail 50 || true

            echo "=============================="
            echo "🧹 STEP 10: Cleanup"

            docker image prune -f || true

            echo "=============================="
            echo "🎉 DEPLOYMENT COMPLETE"
