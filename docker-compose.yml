version: '3.9'

services:
  backend:
    build: .
    container_name: auth-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/authdb

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
